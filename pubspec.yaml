name: cbse_maths_tutor
description: CBSE Class 10 Maths Tutoring App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase Core ──────────────────────────────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_crashlytics: ^3.4.18
  firebase_analytics: ^10.8.9
  firebase_app_check: ^0.2.2+4
  firebase_functions: ^4.6.9

  # ── State Management ────────────────────────────────────────
  provider: ^6.0.5

  # ── UI & Charts ─────────────────────────────────────────────
  fl_chart: ^0.63.0
  cupertino_icons: ^1.0.2
  flutter_math_fork: ^0.7.4   # KaTeX-style TeX rendering (best maintained fork)

  # ── Camera / Gallery ────────────────────────────────────────
  image_picker: ^1.0.4

  # ── Networking ──────────────────────────────────────────────
  http: ^1.1.0

  # ── Local Storage ───────────────────────────────────────────
  shared_preferences: ^2.2.2

  # ── Utilities ───────────────────────────────────────────────
  intl: ^0.18.1
  equatable: ^2.0.5         # value equality for models
  image: ^4.2.0             # pure-dart image analysis (blur/brightness) for OCR quality warnings
  # Removed unused: connectivity_plus, flutter_secure_storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4          # mock Firebase/HTTP dependencies in unit tests
  build_runner: ^2.4.8     # required to generate mockito mocks (@GenerateMocks)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
